server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The container listens on :3000 behind a proxy — never leak scheme/port in redirects.
    absolute_redirect off;
    port_in_redirect off;

    # Security headers (no effect on rendering/design)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Redirect www → apex (handled at app layer in case proxy forwards Host)
    if ($http_host = "www.ngcapital.net") {
        return 301 https://ngcapital.net$request_uri;
    }

    # Legacy WordPress URLs → closest current equivalents (fixes GSC 404s)
    location = /index.php/about-us/meeting { return 301 /book; }
    location = /index.php/learning-center-2/loan-programs { return 301 /#services; }
    location = /index.php/home-4 { return 301 /; }
    location ~ ^/index\.php(/.*)?$ { return 301 /; }

    # Non-existent legacy CMS surfaces: return 410 instead of a soft-404 SPA shell
    location ~* ^/(wp-login\.php|wp-admin|wp-json|wp-content|wp-includes|xmlrpc\.php|administrator/) {
        return 410;
    }

    # Serve prerendered shells at the canonical (slash-less) URLs — no extra 301 hop
    location = /blog { try_files /blog/index.html /index.html; }
    location = /book { try_files /book/index.html /index.html; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
